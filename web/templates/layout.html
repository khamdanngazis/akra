{{define "layout" -}}
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrfToken }}">
<title>{{block "title" .}}{{end}} · AKRA</title>
<link rel="icon" href="{{ asset "img/favicon.svg" }}" type="image/svg+xml">
{{/* Font tanpa versi: URL harus sama dengan url() di app.css. */}}
<link rel="preload" href="/static/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ asset "css/app.css" }}">
<script defer src="{{ asset "js/alpine.min.js" }}"></script>
</head>
<body class="{{block "bodyClass" .}}{{end}}">
{{block "header" .}}{{end}}
<main class="page">
{{template "content" .}}
</main>
</body>
</html>
{{- end}}
